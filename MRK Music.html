  else if(a=='pl'){const p=PL[i];S.stack.push({pid:p.id,k:'t',t:p.name,f:()=>p.ids.map(byId).filter(x=>x&&!x.hide),e:'Add songs from the ⋯ menu on any song.'});render()}
  else if(a=='delpl'){e.stopPropagation();del('p',PL[i].id);PL.splice(i,1);render()}
  else if(a=='mkpl'){const n=($('#npn').value||'').trim();if(!n)return toast('Enter a playlist name');const p={id:'p'+Date.now().toString(36),name:n,ids:[]};PL.push(p);put('p',p);render()}

  else if(a=='fav'||a=='favs'){const t=byId(id||S.sheet.id);t.fav=t.fav?0:1;sv2(t);S.sheet=null;render()}
